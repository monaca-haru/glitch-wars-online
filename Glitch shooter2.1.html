<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GLITCH WARS v0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e20;color:#e9f5ff;font:15px system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:12px}h1{margin:2px 0;color:#5edfff;letter-spacing:3px}h2{font-size:18px;margin:0 0 12px}.muted,small{color:#a6b7d3}.panel{background:#15213a;border:1px solid #364c72;border-radius:14px;padding:13px;margin:10px 0}button,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #4b6b9c}button{background:#275bb0;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.35}input{background:#0a1228;color:white;width:145px}#gamePanel{display:none}.hidden{display:none!important}#characters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}#characters button{padding:7px 2px;background:#0e1931;font-size:11px;min-width:0;border:2px solid #2b4166}#characters button.selected{border-color:#67eaff;background:#17365b}#characters canvas{width:100%;height:auto;image-rendering:pixelated}#desc{min-height:38px;font-size:13px;margin-top:8px;color:#bcd3f5}#roomRow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}#connection,#status{color:#ffdc8b;min-height:21px;font-size:13px}#hud{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}#arena{width:100%;height:auto;aspect-ratio:3/4;max-height:60vh;display:block;border:2px solid #4564a0;border-radius:10px;background:#0b1329;touch-action:none}#energyZone{margin:9px auto 3px;text-align:center;max-width:390px}#energyLabel{font-size:13px;color:#bdeaff;font-weight:700}.energyCells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:5px 0 9px}.energyCells span{height:15px;border-radius:3px;background:#283952}.energyCells span.on{background:#39c9ff;box-shadow:0 0 6px #1ca9f066}#skills{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}#skills button{min-height:56px;font-size:12px;padding:6px 3px}#directionHelp{text-align:center;color:#b6c6e0;font-size:12px;margin:8px 0}#status{margin:6px 0}#result{font-size:22px;color:#ffdf83;text-align:center}#rematch{display:block;margin:8px auto}footer{font-size:12px;color:#a2b4d2;margin:14px 0}code{color:#7aeaff;font-size:20px}#copy{padding:6px}#debug{font-size:11px;color:#98b0d1;word-break:break-word}
</style></head><body><main><h1>GLITCH WARS</h1><small>ONLINE DUEL / v0.2 · 5 CHARACTERS</small><section id="lobby" class="panel"><h2>キャラクター選択</h2><div id="characters"></div><div id="desc"></div><h2>オンライン対戦</h2><p class="muted">2人ともキャラを選んでから、ルームを作成・参加してください。</p><button id="hostBtn">ルームを作る</button><div id="roomRow"><input id="roomInput" placeholder="6桁のコード" inputmode="numeric" maxlength="6"><button id="joinBtn">参加する</button></div><p id="roomDisplay" class="hidden">ルームコード：<code id="roomCode"></code> <button id="copy">コピー</button></p><p id="connection">未接続</p><small>通信：PeerJS / WebRTC。2台の端末が必要です。</small></section><section id="gamePanel" class="panel"><div id="hud"><span id="myHp">自分 HP 5</span><span id="enemyHp">相手 HP 5</span></div><div id="status">通信待ち</div><canvas id="arena" width="360" height="480" aria-label="対戦フィールド。左半分タップで左移動、右半分タップで右移動"></canvas><div id="energyZone"><div id="energyLabel">ENERGY 1 / 10</div><div class="energyCells" id="energyCells"></div><div id="skills"><button data-skill="0">技1<br>2 EN</button><button data-skill="1">技2<br>5 EN</button><button data-skill="2">技3<br>8 EN</button></div></div><div id="directionHelp">画面の左半分をタップ → 左へ移動 ／ 右半分 → 右へ移動<br>最初は停止・タップ後は離しても動き続けます</div><div id="result"></div><button id="rematch" class="hidden">再戦を希望</button><div id="debug"></div></section><footer>PC：← → / A D で移動方向を変更、1・2・3 で技発動。通常弾は自動射撃。技は仮実装・全開放です。対戦通信は試験段階です。</footer></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),W=360,H=480,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const roster=[{name:'ポインタ',color:'#5be6ff',desc:'精密操作型。クリック・ドラッグ・全選択をテーマにしたキャラ。'},{name:'フォルダ',color:'#ffcc55',desc:'建築型。フォルダやゲート、砲台を作るキャラ。'},{name:'エラー',color:'#ff668a',desc:'ルール改変型。警告画面やバグを使うキャラ。'},{name:'ローディ',color:'#80e0a5',desc:'読み込み型。回転するローディングアイコンのキャラ。'},{name:'ダスト',color:'#c59aff',desc:'削除型。ごみ箱・データ消去をテーマにしたキャラ。'}];let choice=0,peer=null,conn=null,isHost=false,slot=0,started=false,game=null,guestView=null,remoteDir=0,localDir=0,remoteSkill=-1,rematch=[false,false],last=0,sendAt=0,inputAt=0,loopId=null,round=0,frame=0,remoteChoice=0;const canvas=$('arena'),ctx=canvas.getContext('2d');function msg(s){$('connection').textContent=s}function character(c,x,y,flip=0,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(flip)ctx.rotate(Math.PI);const col=roster[c]?.color||'#fff';ctx.fillStyle=col;ctx.strokeStyle='#081326';ctx.lineWidth=2;if(c===0){ctx.beginPath();ctx.moveTo(-13,-17);ctx.lineTo(14,0);ctx.lineTo(3,4);ctx.lineTo(8,15);ctx.lineTo(1,19);ctx.lineTo(-4,8);ctx.lineTo(-13,15);ctx.closePath();ctx.fill();ctx.stroke()}else if(c===1){ctx.fillRect(-17,-8,34,25);ctx.fillRect(-15,-15,15,9);ctx.strokeRect(-17,-8,34,25)}else if(c===2){ctx.fillRect(-18,-15,36,31);ctx.strokeRect(-18,-15,36,31);ctx.fillStyle='#25102a';ctx.fillRect(-16,-12,32,7);ctx.fillStyle='#fff';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText('!',0,13)}else if(c===3){for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.globalAlpha=.3+i*.09;ctx.fillRect(Math.cos(a)*12-4,Math.sin(a)*12-4,8,8)}ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(-3,-3,6,6)}else{ctx.fillRect(-15,-10,30,26);ctx.fillRect(-19,-15,38,6);ctx.fillRect(-7,-20,14,5);ctx.fillStyle='#3e2458';ctx.fillRect(-7,-5,4,16);ctx.fillRect(4,-5,4,16)}if(c!==2&&c!==3){ctx.fillStyle='#fff';ctx.fillRect(-7,0,4,4);ctx.fillRect(4,0,4,4)}ctx.restore()}function setupRoster(){const root=$('characters');roster.forEach((c,i)=>{let b=document.createElement('button'),cv=document.createElement('canvas');cv.width=64;cv.height=64;b.appendChild(cv);b.appendChild(document.createElement('div'));b.lastChild.textContent=c.name;b.onclick=()=>{choice=i;updateRoster()};root.appendChild(b);const old=ctx;const cx=cv.getContext('2d');cx.fillStyle='#0c1830';cx.fillRect(0,0,64,64); // preview icon
cx.fillStyle=c.color;cx.strokeStyle='#0b1530';cx.lineWidth=2;cx.save();cx.translate(32,32);if(i===0){cx.beginPath();cx.moveTo(-16,-22);cx.lineTo(17,1);cx.lineTo(3,5);cx.lineTo(10,21);cx.lineTo(0,25);cx.lineTo(-6,9);cx.lineTo(-16,17);cx.closePath();cx.fill()}else if(i===1){cx.fillRect(-20,-11,40,30);cx.fillRect(-18,-19,19,10)}else if(i===2){cx.fillRect(-21,-18,42,37);cx.fillStyle='#fff';cx.font='bold 28px monospace';cx.textAlign='center';cx.fillText('!',0,13)}else if(i===3){for(let j=0;j<8;j++){cx.globalAlpha=.3+j*.09;cx.fillRect(Math.cos(j*Math.PI/4)*17-5,Math.sin(j*Math.PI/4)*17-5,10,10)}}else{cx.fillRect(-17,-10,34,32);cx.fillRect(-21,-17,42,7);cx.fillRect(-8,-23,16,6)}cx.restore()});updateRoster()}function updateRoster(){[...$('characters').children].forEach((b,i)=>b.classList.toggle('selected',i===choice));$('desc').textContent=roster[choice].desc}setupRoster();function makePeer(id){return new Promise((resolve,reject)=>{if(!window.Peer)return reject(Error('PeerJSの読み込みに失敗'));const p=new Peer(id,{debug:0});let done=false;p.on('open',()=>{done=true;resolve(p)});p.on('error',e=>{if(!done){done=true;reject(e)}else msg('通信エラー '+e.type)});setTimeout(()=>{if(!done){done=true;p.destroy();reject(Error('接続準備がタイムアウト'))}},12000)})}function send(o){if(conn?.open)try{conn.send(o)}catch(e){msg('送信失敗 '+e.message)}}function player(i,c){return {x:180,y:i===0?424:56,hp:5,en:1,regen:0,shoot:.15,cool:[0,0,0],dir:0,char:c}}function reset(){game={players:[player(0,choice),player(1,remoteChoice)],bullets:[],tick:0,winner:null,round:++round};remoteDir=0;remoteSkill=-1;rematch=[false,false];guestView=null;$('result').textContent='';$('rematch').classList.add('hidden');$('rematch').disabled=false}function start(){started=true;$('lobby').classList.add('hidden');$('gamePanel').style.display='block';last=performance.now();sendAt=last;inputAt=last;frame=0;if(loopId)clearInterval(loopId);loopId=setInterval(()=>step(performance.now()),33);step(performance.now())}function attach(c){conn=c;msg('接続中…');c.on('open',()=>{msg('接続成功');send({type:'hello',char:choice});if(isHost){reset();send({type:'start',char:choice});start()}else start()});c.on('data',d=>{if(!d||typeof d!=='object')return;if(isHost){if(d.type==='hello'){remoteChoice=Number.isInteger(d.char)&&d.char>=0&&d.char<5?d.char:0;if(game)game.players[1].char=remoteChoice}if(d.type==='input'){remoteDir=clamp(Number(d.dir)||0,-1,1);if(Number.isInteger(d.skill)&&d.skill>=0&&d.skill<=2)remoteSkill=d.skill}if(d.type==='rematch'){rematch[1]=true;tryRematch()}}else{if(d.type==='state'&&d.game)guestView=d.game;if(d.type==='start'){remoteChoice=d.char||0}if(d.type==='restart'){guestView=null;$('result').textContent='';$('rematch').classList.add('hidden');$('rematch').disabled=false}}});c.on('close',()=>{started=false;if(loopId)clearInterval(loopId);$('status').textContent='通信が切れました';$('result').textContent='再接続にはページを再読み込みしてください'});c.on('error',()=>msg('通信エラー'))} $('hostBtn').onclick=async()=>{ $('hostBtn').disabled=true;try{let code=String(Math.floor(100000+Math.random()*900000));peer=await makePeer('glitchwars-v01-'+code);isHost=true;slot=0;$('roomCode').textContent=code;$('roomDisplay').classList.remove('hidden');msg('参加を待っています…');peer.on('connection',c=>{if(conn?.open){c.on('open',()=>c.close());return}attach(c)})}catch(e){msg(e.message);$('hostBtn').disabled=false}};$('joinBtn').onclick=async()=>{let code=$('roomInput').value.trim();if(!/^\d{6}$/.test(code))return msg('6桁の数字を入力してください');$('joinBtn').disabled=true;try{peer=await makePeer(undefined);isHost=false;slot=1;attach(peer.connect('glitchwars-v01-'+code,{reliable:true}));setTimeout(()=>{if(!conn?.open)msg('接続できません。コードを確認してください')},12000)}catch(e){msg(e.message);$('joinBtn').disabled=false}};$('copy').onclick=()=>{let code=$('roomCode').textContent;if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>msg('コピーしました')).catch(()=>msg(code));else msg(code)};
function shoot(i,kind=0){let p=game.players[i],dir=i===0?-1:1;const add=(vx,vy,size=5,color)=>game.bullets.push({x:p.x,y:p.y+dir*20,vx,vy,size,owner:i,color:color||(i===0?'#57ddff':'#ff7395')});if(kind===0)add(0,dir*240);if(kind===1)[-85,0,85].forEach(v=>add(v,dir*270,5,'#ffe07b'));if(kind===2)add(0,dir*400,9,'#d9a0ff');if(kind===3)[-140,-95,-50,0,50,95,140].forEach(v=>add(v,dir*245,6,'#ffbb6a'))}function useSkill(i,k){if(!game||game.winner!==null)return;let p=game.players[i],cost=[2,5,8][k];if(p.en<cost||p.cool[k]>0)return;p.en-=cost;p.cool[k]=[.5,1.3,2.5][k];shoot(i,k+1)}function tick(dt){if(!game||game.winner!==null)return;dt=Math.min(dt,.15);game.tick+=dt;game.players.forEach((p,i)=>{let dir=i===0?localDir:remoteDir;p.dir=dir;p.x=clamp(p.x+dir*160*dt,19,W-19);p.regen+=dt;while(p.regen>=2){p.en=Math.min(10,p.en+1);p.regen-=2}p.shoot-=dt;while(p.shoot<=0){shoot(i);p.shoot+=.85}p.cool=p.cool.map(c=>Math.max(0,c-dt))});if(remoteSkill>=0){useSkill(1,remoteSkill);remoteSkill=-1}for(let b of game.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;let t=game.players[1-b.owner];if(Math.abs(b.x-t.x)<b.size+13&&Math.abs(b.y-t.y)<b.size+13){t.hp=Math.max(0,t.hp-1);b.dead=true;if(t.hp===0)game.winner=b.owner}}game.bullets=game.bullets.filter(b=>!b.dead&&b.y>-25&&b.y<H+25&&b.x>-25&&b.x<W+25).slice(-150)}function render(g){if(!g)return;ctx.fillStyle='#0b1329';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#233451';ctx.lineWidth=1;for(let x=0;x<=W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.setLineDash([6,8]);ctx.strokeStyle='#546585';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);g.players.forEach((p,i)=>character(p.char||0,p.x,p.y,i===1));g.bullets.forEach(b=>{ctx.fillStyle=b.color;ctx.fillRect(b.x-b.size,b.y-b.size,b.size*2,b.size*2)});let me=g.players[slot],enemy=g.players[1-slot];$('myHp').textContent='自分 '+roster[me.char||0].name+' HP '+me.hp+'/5';$('enemyHp').textContent='相手 '+roster[enemy.char||0].name+' HP '+enemy.hp+'/5';$('energyLabel').textContent='ENERGY '+me.en+' / 10';[...$('energyCells').children].forEach((e,i)=>e.classList.toggle('on',i<me.en));document.querySelectorAll('[data-skill]').forEach((b,i)=>b.disabled=me.en<[2,5,8][i]||g.winner!==null);$('status').textContent=g.winner!==null?'ラウンド終了':'対戦中（更新 '+Math.floor(g.tick||0)+'秒）';if(g.winner!==null){$('result').textContent=g.winner===slot?'勝利！':'敗北！';$('rematch').classList.remove('hidden')}}for(let i=0;i<10;i++)$('energyCells').appendChild(document.createElement('span'));function step(now){if(!started)return;try{let dt=Math.max(0,Math.min((now-last)/1000,.15));last=now;if(isHost){tick(dt);if(now-sendAt>=50){send({type:'state',game});sendAt=now}render(game)}else{if(now-inputAt>=50){send({type:'input',dir:localDir,skill:-1});inputAt=now}render(guestView||{players:[player(0,remoteChoice),player(1,choice)],bullets:[],tick:0,winner:null});if(!guestView)$('status').textContent='相手のゲーム情報を受信中…'}frame++;if(frame%30===0)$('debug').textContent='診断: '+(isHost?'ホスト':'ゲスト')+' / '+frame+'更新 / '+(conn?.open?'接続中':'未接続')+' / '+(isHost?'送信中':guestView?'受信中':'受信待ち')}catch(e){$('status').textContent='更新エラー: '+e.message;console.error(e);started=false;if(loopId)clearInterval(loopId)}}function skill(k){if(!started)return;if(isHost)useSkill(0,k);else send({type:'input',dir:localDir,skill:k})}document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>skill(Number(b.dataset.skill)));function setDir(d){localDir=d;if(started&&!isHost)send({type:'input',dir:localDir,skill:-1})}canvas.addEventListener('pointerdown',e=>{e.preventDefault();let r=canvas.getBoundingClientRect();setDir(e.clientX-r.left<r.width/2?-1:1)});document.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){setDir(-1);e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){setDir(1);e.preventDefault()}if(['1','2','3'].includes(e.key)&&!e.repeat)skill(Number(e.key)-1)});function tryRematch(){if(rematch[0]&&rematch[1]){reset();send({type:'restart'});send({type:'state',game})}}$('rematch').onclick=()=>{rematch[slot]=true;$('rematch').disabled=true;$('result').textContent='相手の再戦希望を待っています…';if(isHost)tryRematch();else send({type:'rematch'})};})();
</script></body></html>
