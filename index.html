<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GLITCH WARS — Online Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#090f21;color:#e9f3ff;font-family:system-ui,sans-serif;touch-action:manipulation}main{max-width:680px;margin:auto;padding:14px}h1{margin:4px 0;color:#63e3ff;letter-spacing:3px}small,.muted{color:#9caccb}.panel{background:#151f38;border:1px solid #34486b;border-radius:14px;padding:14px;margin:12px 0}button,input,select{font:inherit;border-radius:9px;padding:11px;border:1px solid #526c9c}button{background:#2457aa;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.35}input{background:#0b1329;color:white;max-width:160px}#gamePanel{display:none}#arena{width:100%;height:auto;aspect-ratio:3/4;max-height:65vh;background:#0a1026;border:2px solid #44609a;border-radius:10px;display:block;touch-action:none}#hud{display:flex;justify-content:space-between;gap:8px;font-size:13px}#status{min-height:22px;color:#ffd16b}#controls{display:flex;gap:8px;justify-content:space-between;margin-top:10px}#controls button{min-height:62px;touch-action:none;user-select:none;-webkit-user-select:none}#move{display:flex;gap:8px}#move button{min-width:65px;font-size:25px}#skills{display:flex;gap:5px}#skills button{font-size:12px;min-width:60px;padding:5px}.bar{height:12px;background:#26324c;border-radius:8px;overflow:hidden;margin:5px 0}.fill{height:100%;background:#45d5ff;transition:width .12s}.hidden{display:none!important}#result{font-size:22px;text-align:center;color:#ffe282}code{color:#7fe8ff;font-size:20px}#roomRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}footer{font-size:12px;color:#a4b4d0;margin:20px 0}#copy{padding:7px}#connection{font-size:12px;color:#b8e9cc}</style></head><body><main><h1>GLITCH WARS</h1><small>ONLINE DUEL / PROTOTYPE 0.1</small><section id="lobby" class="panel"><h2>オンライン対戦</h2><p>1人がルームを作り、もう1人がコードで参加します。</p><button id="hostBtn">ルームを作る</button><div id="roomRow" style="margin-top:12px"><input id="roomInput" placeholder="6桁のコード" inputmode="numeric" maxlength="6"><button id="joinBtn">参加する</button></div><p id="roomDisplay" class="hidden">ルームコード：<code id="roomCode"></code> <button id="copy">コピー</button></p><p id="connection">未接続</p><p class="muted">※ 2台の端末とインターネット接続が必要です。対戦接続には外部の無料PeerJSシグナリングサービスを使用します。</p></section><section id="gamePanel"><div class="panel"><div id="hud"><span id="myHp">自分 HP 5</span><span id="enemyHp">相手 HP 5</span></div><div class="bar"><div class="fill" id="energyBar" style="width:10%"></div></div><div id="energyText">ENERGY 1 / 10</div><div id="status"></div><canvas id="arena" width="360" height="480"></canvas><div id="controls"><div id="move"><button id="left" aria-label="左移動">◀</button><button id="right" aria-label="右移動">▶</button></div><div id="skills"><button data-skill="0">技1<br>2 EN</button><button data-skill="1">技2<br>5 EN</button><button data-skill="2">技3<br>8 EN</button></div></div><p class="muted">通常弾は自動発射。技は今回はテスト用に全開放しています。</p><div id="result"></div><button id="rematch" class="hidden">再戦を希望</button></div></section><footer>PC: ← → / A D で移動、1・2・3 で技発動。通信はP2P（WebRTC）。試作品のため、通信環境によって接続できない場合があります。</footer></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),W=360,H=480,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let peer=null,conn=null,isHost=false,slot=0,started=false,keys={left:false,right:false},game=null,last=0,lastSend=0,lastInput=0,remoteKeys={left:false,right:false},remoteSkill=-1,rematch=[false,false],guestView=null,seq=0;const cvs=$('arena'),ctx=cvs.getContext('2d');const message=s=>$('connection').textContent=s;const rand=()=>String(Math.floor(100000+Math.random()*900000));function makePeer(id){return new Promise((resolve,reject)=>{if(!window.Peer){reject(Error('通信ライブラリを読み込めません'));return}const p=new Peer(id,{debug:0});let done=false;p.on('open',()=>{done=true;resolve(p)});p.on('error',e=>{if(!done)reject(e);else message('通信エラー: '+e.type)});setTimeout(()=>{if(!done){p.destroy();reject(Error('接続準備がタイムアウトしました'))}},12000)})}function send(obj){if(conn&&conn.open)try{conn.send(obj)}catch(e){message('送信に失敗しました')}}function showGame(){started=true;$('lobby').classList.add('hidden');$('gamePanel').style.display='block';$('status').textContent='対戦開始！';$('result').textContent='';$('rematch').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function player(i){return {x:180,y:i===0?426:54,hp:5,en:1,regen:0,shoot:0,cool:[0,0,0]}}function reset(){game={players:[player(0),player(1)],bullets:[],tick:0,winner:null,round:++seq};remoteKeys={left:false,right:false};remoteSkill=-1;rematch=[false,false];guestView=null;$('result').textContent='';$('rematch').disabled=false;$('rematch').classList.add('hidden');}function attach(c){conn=c;message('接続中…');c.on('open',()=>{message('接続成功');if(isHost){reset();send({type:'start'});showGame()}else{send({type:'hello'});showGame()}});c.on('data',data=>{if(!data||typeof data!=='object')return;if(isHost){if(data.type==='input'){remoteKeys={left:!!data.left,right:!!data.right};if(Number.isInteger(data.skill)&&data.skill>=0&&data.skill<=2)remoteSkill=data.skill}if(data.type==='rematch'){rematch[1]=true;tryRematch()}}else{if(data.type==='state'&&data.game)guestView=data.game;if(data.type==='restart'){$('result').textContent='';$('rematch').disabled=false;$('rematch').classList.add('hidden')}if(data.type==='start')message('接続成功')}});c.on('close',()=>{message('相手との接続が切れました');$('status').textContent='接続が切れました';started=false;$('result').textContent='接続が切れました。再接続はページを再読み込みしてください。'});c.on('error',()=>message('接続エラー'))} $('hostBtn').onclick=async()=>{ $('hostBtn').disabled=true;try{const code=rand();peer=await makePeer('glitchwars-v01-'+code);isHost=true;slot=0;$('roomCode').textContent=code;$('roomDisplay').classList.remove('hidden');message('友達の参加を待っています…');peer.on('connection',c=>{if(conn&&conn.open){c.on('open',()=>c.close());return}attach(c)})}catch(e){message('作成できません: '+e.message);$('hostBtn').disabled=false}};$('joinBtn').onclick=async()=>{const code=$('roomInput').value.trim();if(!/^\d{6}$/.test(code)){message('6桁の数字を入力してください');return}$('joinBtn').disabled=true;try{peer=await makePeer(undefined);isHost=false;slot=1;attach(peer.connect('glitchwars-v01-'+code,{reliable:true}));setTimeout(()=>{if(!conn?.open)message('接続できません。コードや相手の接続状態を確認してください')},12000)}catch(e){message('参加できません: '+e.message);$('joinBtn').disabled=false}};$('copy').onclick=()=>{const code=$('roomCode').textContent;if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>message('コードをコピーしました')).catch(()=>message('コード: '+code));else message('コード: '+code)};function shoot(i,kind=0){let p=game.players[i],dir=i===0?-1:1;const add=(vx,vy,size=5,damage=1,color)=>game.bullets.push({x:p.x,y:p.y+dir*17,vx,vy,size,damage,owner:i,color:color||(i===0?'#56dcff':'#ff7192')});if(kind===0)add(0,dir*240);if(kind===1){for(let vx of [-85,0,85])add(vx,dir*260,5,1,'#ffda6c')}if(kind===2){add(0,dir*390,8,1,'#bc95ff')}if(kind===3){for(let vx of [-140,-95,-50,0,50,95,140])add(vx,dir*230,6,1,'#ffb858')}}function useSkill(i,k){if(!game||game.winner!==null)return;let p=game.players[i],cost=[2,5,8][k];if(p.en<cost||p.cool[k]>0)return;p.en-=cost;p.cool[k]=[.6,1.4,3][k];shoot(i,k+1)}function tick(dt){if(!game||game.winner!==null)return;dt=Math.min(dt,.05);game.tick+=dt;game.players.forEach((p,i)=>{const input=i===0?keys:remoteKeys;p.x=clamp(p.x+((input.right?1:0)-(input.left?1:0))*185*dt,20,W-20);p.regen+=dt;while(p.regen>=2){p.en=Math.min(10,p.en+1);p.regen-=2}p.shoot-=dt;while(p.shoot<=0){shoot(i);p.shoot+=.9}p.cool=p.cool.map(c=>Math.max(0,c-dt))});if(remoteSkill>=0){useSkill(1,remoteSkill);remoteSkill=-1}for(let b of game.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;const target=game.players[1-b.owner];if(Math.abs(b.x-target.x)<b.size+13&&Math.abs(b.y-target.y)<b.size+13){target.hp=Math.max(0,target.hp-b.damage);b.dead=true;if(target.hp===0)game.winner=b.owner}}game.bullets=game.bullets.filter(b=>!b.dead&&b.y>-30&&b.y<H+30&&b.x>-30&&b.x<W+30).slice(-120);if(game.winner!==null){$('rematch').classList.remove('hidden')}}function tryRematch(){if(rematch[0]&&rematch[1]){reset();send({type:'restart'})}}$('rematch').onclick=()=>{rematch[slot]=true;$('rematch').disabled=true;$('result').textContent='相手の再戦希望を待っています…';if(isHost)tryRematch();else send({type:'rematch'})};function render(g){if(!g)return;ctx.fillStyle='#0a1026';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#243555';ctx.lineWidth=1;for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.setLineDash([6,8]);ctx.strokeStyle='#526484';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);for(let i=0;i<2;i++){let p=g.players[i];if(!p)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(i===0?0:Math.PI);ctx.fillStyle=i===0?'#4ad7ff':'#ff6588';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(17,13);ctx.lineTo(0,7);ctx.lineTo(-17,13);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-3,-2,6,6);ctx.restore()}for(let b of g.bullets){ctx.fillStyle=b.color;ctx.fillRect(b.x-b.size,b.y-b.size,b.size*2,b.size*2)}let me=g.players[slot],enemy=g.players[1-slot];$('myHp').textContent='自分 HP '+me.hp+'/5';$('enemyHp').textContent='相手 HP '+enemy.hp+'/5';$('energyBar').style.width=(me.en*10)+'%';$('energyText').textContent='ENERGY '+me.en+' / 10';document.querySelectorAll('[data-skill]').forEach((el,i)=>el.disabled=me.en<[2,5,8][i]||g.winner!==null);if(g.winner!==null){$('result').textContent=g.winner===slot?'勝利！':'敗北！';$('status').textContent='ラウンド終了';$('rematch').classList.remove('hidden')}else $('status').textContent='対戦中'}function loop(now){if(!started)return;const dt=Math.min((now-last)/1000,.05);last=now;if(isHost){tick(dt);if(now-lastSend>50){send({type:'state',game});lastSend=now}render(game)}else{if(now-lastInput>50){send({type:'input',left:keys.left,right:keys.right,skill:-1});lastInput=now}render(guestView)}requestAnimationFrame(loop)}function skill(k){if(!started)return;if(isHost)useSkill(0,k);else send({type:'input',left:keys.left,right:keys.right,skill:k})}document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>skill(Number(b.dataset.skill)));for(let [id,dir] of [['left','left'],['right','right']]){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[dir]=true;el.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[dir]=false)}document.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){keys.left=true;e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){keys.right=true;e.preventDefault()}if(['1','2','3'].includes(e.key)&&!e.repeat)skill(Number(e.key)-1)});document.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});window.addEventListener('blur',()=>{keys.left=false;keys.right=false});})();
</script></body></html>
